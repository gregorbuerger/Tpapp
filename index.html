<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="apple-mobile-web-app-capable" content="yes"><title>Tanken & Parken – Pilot</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"><link rel="stylesheet" href="styles.css"></head><body><main id="app"><div id="map"></div>
<header class="topbar"><div class="brand"><span class="brand-dot"></span><span>Tanken & Parken</span><span class="version-badge">v2.4</span></div><button class="icon-btn" id="locateBtn" aria-label="Mein Standort">⌖</button></header>
<section class="searchbox"><form id="addressForm"><span>⌕</span><input id="addressInput" autocomplete="street-address" placeholder="Ziel in Ottobeuren oder Memmingen"><button type="button" id="clearSearch" aria-label="Löschen">×</button></form><div id="suggestions" class="suggestions"></div></section>
<section class="controls"><div class="segmented"><button class="seg active" data-mode="all">Alles</button><button class="seg" data-mode="fuel">⛽ Tanken</button><button class="seg" data-mode="parking">🅿 Parken</button></div><div class="fuel-filter" id="fuelFilter"><button class="fuel-chip active" data-fuel="e10">E10</button><button class="fuel-chip" data-fuel="e5">E5</button><button class="fuel-chip" data-fuel="diesel">Diesel</button></div></section>
<button id="searchHere" class="search-here">↻ Hier suchen</button>
<section class="bottom-sheet"><div class="grabber"></div><div class="pilot"><span>PILOTGEBIET</span> Ottobeuren ↔ Memmingen</div><div id="targetInfo" class="target-info hidden"></div><div class="summary-row"><div><strong id="resultCount"></strong><span id="areaText"> in der Kartenansicht</span></div><button id="updateBtn" class="update-btn" type="button">↻ Update</button></div><div id="updateStatus" class="update-status hidden"></div><div id="cards" class="cards"></div><p class="source-note">Nur reale Daten · Parkplatzangaben aus offiziellen Quellen · Tankstellen erscheinen erst mit aktiver Tankerkönig-Livequelle.</p></section>
</main><script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script src="app.js"></script></body></html>
