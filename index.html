<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><title>Tanken & Parken</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"><link rel="stylesheet" href="styles.css"></head><body><main id="app"><div id="map"></div>
<header class="topbar"><div class="brand"><div><strong>Tanken & Parken</strong><small>Ottobeuren · Memmingen</small></div></div><div class="top-actions"><button class="info-btn" id="infoBtn" aria-label="Info und Datenquellen">i</button><span class="version-badge">v3.1</span><button class="icon-btn" id="locateBtn" aria-label="Mein Standort">◎</button></div></header>
<section class="searchbox"><form id="addressForm"><span class="search-icon">⌕</span><input id="addressInput" autocomplete="street-address" placeholder="Wohin möchtest du?"><button type="button" id="clearSearch" aria-label="Löschen">×</button></form><div id="suggestions" class="suggestions"></div></section>
<section class="filterbar"><button class="filter active" data-mode="all">Alles</button><button class="filter" data-mode="parking">Parken</button><button class="filter" data-mode="fuel">Tanken</button><div class="fuel-filter" id="fuelFilter"><button class="fuel-chip active" data-fuel="e10">E10</button><button class="fuel-chip" data-fuel="e5">E5</button><button class="fuel-chip" data-fuel="diesel">Diesel</button></div></section>
<button id="searchHere" class="search-here">In diesem Bereich suchen</button>
<section class="result-dock" id="bottomSheet"><button id="sheetMini" class="dock-summary" type="button"><div><strong id="miniCount">Parkplätze</strong><span id="dockSubtitle">in der Kartenansicht</span></div><span class="dock-arrow">⌃</span></button><div id="sheetContent" class="sheet-content hidden"><div class="sheet-header"><div><strong id="resultCount"></strong><span id="areaText"> in der Kartenansicht</span></div><div class="sheet-actions"><button id="updateBtn" class="text-btn" type="button">Update</button><button id="sheetToggle" class="close-btn" type="button" aria-label="Ergebnisse schließen">×</button></div></div><div id="targetInfo" class="target-info hidden"></div><div id="updateStatus" class="update-status hidden"></div><div id="cards" class="cards"></div><p class="source-note">Nur reale Daten. Fehlende Live-Daten werden nicht geschätzt.</p></div></section><section id="placeDetail" class="place-detail hidden"></section>
</main><script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script src="app.js"></script></body></html>
