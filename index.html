<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Tanken & Parken</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <div id="map" aria-label="Karte mit Tankstellen und Parkmöglichkeiten"></div>

    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>Tanken & Parken</span></div>
      <button class="icon-btn" id="locateBtn" aria-label="Mein Standort" title="Mein Standort">⌖</button>
    </header>

    <section class="controls" aria-label="Kartenfilter">
      <div class="segmented">
        <button class="seg active" data-mode="all">Alles</button>
        <button class="seg" data-mode="fuel">⛽ Tanken</button>
        <button class="seg" data-mode="parking">🅿 Parken</button>
      </div>
      <div class="fuel-filter" id="fuelFilter">
        <button class="fuel-chip active" data-fuel="e10">E10</button>
        <button class="fuel-chip" data-fuel="e5">E5</button>
        <button class="fuel-chip" data-fuel="diesel">Diesel</button>
      </div>
    </section>

    <button id="searchHere" class="search-here">↻ Hier suchen</button>

    <section class="bottom-sheet" id="sheet" aria-live="polite">
      <div class="grabber"></div>
      <div class="summary-row">
        <div><strong id="resultCount">7 Orte</strong><span id="areaText"> in der Kartenansicht</span></div>
        <span class="demo-badge">DEMO</span>
      </div>
      <div id="cards" class="cards"></div>
      <p class="source-note">Demo-Daten · später Tankerkönig + ParkAPI/OSM über Val Town</p>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
